<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cosmic Lance — Duy Hoàng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=2">
  <link rel="icon" type="image/jpeg" href="assets/img/favicon.jpg">
  <style>
    body { background: #070910; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; width: 100vw; height: 100vh; }
    .nav { position: fixed; top: 0; width: 100%; z-index: 100; }
    
    #game-container { width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    
    #ui { position: absolute; top: 80px; left: 20px; font-family: 'Press Start 2P', monospace; font-size: 16px; text-shadow: 2px 2px 0 #000; z-index: 5; pointer-events: none; display:flex; flex-direction:column; gap:15px; }
    .val { color: var(--purple); }
    
    #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    #overlay h2 { font-size: 48px; color: var(--purple); margin-bottom: 20px; font-family: 'Press Start 2P', monospace; text-shadow: 0 0 20px var(--purple); text-align:center; line-height:1.4;}
    #overlay h2.failed { color: #ff6b6b; text-shadow: 0 0 20px #ff6b6b; }
    .btn-play { background: var(--purple); color: #fff; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; font-family: 'Press Start 2P', monospace; margin-top:20px;}
    .btn-play:hover { background: #705ad4; transform: scale(1.05); }

    /* LeetCode Modal */
    #leetcode-modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 20; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .lc-box { background: #1a1e29; border: 2px solid var(--purple); border-radius: 12px; padding: 30px; max-width: 600px; width: 100%; }
    .lc-box h3 { color: var(--purple); font-family: 'Press Start 2P', monospace; font-size: 18px; margin-top: 0; margin-bottom: 20px; }
    .lc-question { font-size: 16px; line-height: 1.6; margin-bottom: 25px; color: #c8d0dc; font-family: monospace; }
    .lc-options { display: flex; flex-direction: column; gap: 10px; }
    .lc-opt-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 15px; border-radius: 8px; cursor: pointer; font-family: monospace; font-size: 14px; text-align: left; transition: 0.2s; }
    .lc-opt-btn:hover { background: rgba(141,115,255,0.2); border-color: var(--purple); }
  </style>
  <script src="assets/js/audio.js"></script>
</head>
<body>
  <nav class="nav" style="background: rgba(7,9,16,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05);"><div class="container nav-inner">
    <a class="brand" href="journey.html"><i class="fa-solid fa-arrow-left"></i> &nbsp; Back to Journey</a>
  </div></nav>
  
  <div id="game-container">
    <div id="ui">
      <div>SCORE: <span id="score" class="val">0</span></div>
      <div>LIVES: <span id="lives" class="val" style="color:#ff6b6b">3</span></div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="overlay">
      <h2>COSMIC LANCE</h2>
      <p style="margin-bottom: 30px; font-family: monospace; font-size: 18px; color: #feca57; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; border: 1px solid #feca57; text-align: center; line-height: 1.6;">🎮 Phím tắt: Dùng W, A, S, D để di chuyển.<br>🚀 Tàu chiến sẽ tự động xả đạn!</p>
      <button class="btn-play" onclick="startGame()">LAUNCH</button>
    </div>

    <div id="leetcode-modal">
      <div class="lc-box">
        <h3>🚨 HULL BREACH! 🚨</h3>
        <div class="lc-question" id="lc-q">Question text goes here.</div>
        <div class="lc-options" id="lc-options"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const lcModal = document.getElementById('leetcode-modal');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const bgImage = new Image();
    bgImage.src = 'assets/img/bg_space.jpg';

    // Leetcode Questions Database
        const leetcodeDB = [
      { q: "What is the time complexity of searching an element in a balanced Binary Search Tree?", opts: ["O(1)", "O(n)", "O(log n)", "O(n log n)"], ans: 2 },
      { q: "Which data structure uses LIFO (Last In First Out)?", opts: ["Queue", "Stack", "Array", "Linked List"], ans: 1 },
      { q: "In Node.js, what handles asynchronous operations?", opts: ["Thread Pool", "Event Loop", "V8 Engine", "DOM"], ans: 1 },
      { q: "Which SQL clause is used to filter records after GROUP BY?", opts: ["WHERE", "ORDER BY", "HAVING", "FILTER"], ans: 2 },
      { q: "What is the space complexity of quicksort in the best case?", opts: ["O(1)", "O(log n)", "O(n)", "O(n^2)"], ans: 1 },
      { q: "What does CSS stand for?", opts: ["Cascading Style Sheets", "Computer Style Sheets", "Creative Style Sheets", "Colorful Style Sheets"], ans: 0 },
      { q: "Which HTTP method is idempotent?", opts: ["POST", "PATCH", "PUT", "CONNECT"], ans: 2 },
      { q: "What is a closure in JavaScript?", opts: ["A function bundled with its lexical environment", "A closed browser tab", "A private class variable", "A loop condition"], ans: 0 },
      { q: "Which React hook is used for side effects?", opts: ["useState", "useEffect", "useMemo", "useRef"], ans: 1 },
      { q: "What is the Big-O for checking if a key exists in a Hash Map?", opts: ["O(1)", "O(n)", "O(log n)", "O(n^2)"], ans: 0 },
      { q: "What is the primary function of a reverse proxy?", opts: ["To encrypt data", "To route client requests to servers", "To route server requests to clients", "To cache local memory"], ans: 1 },
      { q: "Which design pattern restricts a class to a single instance?", opts: ["Factory", "Observer", "Singleton", "Decorator"], ans: 2 },
      { q: "What is Git rebase used for?", opts: ["To delete a branch", "To merge without history", "To move a branch to a new base commit", "To undo a commit"], ans: 2 },
      { q: "Which property is used in CSS Flexbox to align items vertically?", opts: ["justify-content", "align-items", "flex-direction", "align-content"], ans: 1 },
      { q: "What does API stand for?", opts: ["Application Programming Interface", "Advanced Program Integration", "Automated Process Interface", "Application Process Integration"], ans: 0 },
      { q: "Which algorithm is commonly used for finding the shortest path?", opts: ["Bubble Sort", "Dijkstra's Algorithm", "Binary Search", "DFS"], ans: 1 },
      { q: "What is a Promise in JavaScript?", opts: ["A guaranteed loop", "An object representing eventual completion/failure", "A strict type checker", "A database query"], ans: 1 },
      { q: "Which command creates a new React app?", opts: ["npm run react", "npx create-react-app", "node init react", "npm install react-dom"], ans: 1 },
      { q: "What is the default port for HTTP?", opts: ["443", "8080", "80", "22"], ans: 2 },
      { q: "Which protocol is used for secure communication over the web?", opts: ["FTP", "HTTP", "HTTPS", "SMTP"], ans: 2 }
    ];
    let availableQuestions = [];

    let state = 'menu'; // menu, playing, leetcode, over
    let score = 0;
    let lives = 3;
    let bgOffsetY = 0;
    let currentEnemy = null;
    let bosses = [];
    let bossSpawnThreshold = 5000;
    let traps = [];
    let isBossActive = false;
    let bossBullets = [];
    let justAnswered = false; // Invulnerability frame logic
    let invulnTimer = 0;
    
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.code.toLowerCase()] = false);

    // Player
    const player = { x: 400, y: 500, width: 60, height: 60, speed: 7, cooldown: 0, fireRate: 12, weaponLevel: 1 };
    let bullets = [];
    let enemies = [];
    let particles = [];
    let powerups = [];

    function startGame() {
      availableQuestions = [...leetcodeDB];
      state = 'playing';
      score = 0;
      lives = 3;
      scoreEl.innerText = score;
      livesEl.innerText = lives;
      overlay.style.display = 'none';
      lcModal.style.display = 'none';
      
      startBGM('space');
      
      player.x = canvas.width / 2;
      player.y = canvas.height * 0.8;
      bullets = [];
      enemies = [];
      particles = [];
      powerups = [];
      bosses = [];
      traps = [];
      bossBullets = [];
      bossSpawnThreshold = 5000;
      isBossActive = false;
      player.weaponLevel = 1;
      invulnTimer = 120; // 2 seconds of invulnerability at start
    }

    function spawnPowerup(x, y) {
      if(Math.random() < 0.15) { // 15% drop rate
        powerups.push({
          x: x, y: y, radius: 15,
          type: Math.random() > 0.5 ? 'weapon' : 'life',
          speed: 2 + Math.random()
        });
      }
    }
    
    function spawnEnemy() {
      // Spawn minions
      let spawnRate = isBossActive ? 0.12 : 0.05; // More minions if boss is alive
      if(Math.random() < spawnRate) {
        enemies.push({
          x: Math.random() * (canvas.width - 40), y: -40, width: 40, height: 40,
          speedX: (Math.random() - 0.5) * 3, speedY: 2 + Math.random() * 3,
          hp: 2, color: Math.random() > 0.5 ? '#8d73ff' : '#ff6b6b'
        });
      }
      
      // Spawn boss every 5000 points
      if (score >= bossSpawnThreshold) {
         bossSpawnThreshold += 5000;
         isBossActive = true;
         bosses.push({
            x: canvas.width / 2 - 100, y: -200, width: 200, height: 200,
            speedX: 2, speedY: 0.5,
            hp: 300, maxHp: 300, color: '#ff6b6b'
         });
      }
      
      // Spawn Traps (> 20k points)
      if (score >= 20000) {
         let trapChance = 0.005 + (score - 20000) / 500000;
         if (Math.random() < trapChance) {
            let numTraps = Math.min(3, Math.floor(score / 20000));
            for(let i=0; i<numTraps; i++) {
               let isHorizontal = Math.random() > 0.5;
               traps.push({
                  isHorizontal: isHorizontal,
                  pos: isHorizontal ? Math.random() * (canvas.height - 100) + 50 : Math.random() * (canvas.width - 100) + 50,
                  warnTimer: 90, // 1.5 seconds warning
                  activeTimer: 30, // 0.5 seconds active
                  thickness: 40 + Math.random()*20
               });
            }
         }
      }
    }

    function spawnParticles(x, y, color) {
      for(let i=0; i<15; i++){
        particles.push({
          x, y,
          vx: (Math.random()-0.5)*12,
          vy: (Math.random()-0.5)*12,
          life: 40,
          color
        });
      }
    }

    function triggerLeetCode(enemy) {
      playSound('alert');
      state = 'leetcode';
      if(availableQuestions.length === 0) availableQuestions = [...leetcodeDB];
      let rIdx = Math.floor(Math.random() * availableQuestions.length);
      let qData = availableQuestions[rIdx];
      availableQuestions.splice(rIdx, 1);
      currentEnemy = enemy;
      currentEnemy.qData = qData;
      
      document.getElementById('lc-q').innerText = qData.q;
      let optsHtml = '';
      qData.opts.forEach((opt, i) => {
        optsHtml += `<button class="lc-opt-btn" onclick="checkAnswer(${i})">${['A','B','C','D'][i]}. ${opt}</button>`;
      });
      document.getElementById('lc-options').innerHTML = optsHtml;
      
      lcModal.style.display = 'flex';
    }

    function checkAnswer(idx) {
      // Remove enemy in both cases
      let idxEnemy = enemies.indexOf(currentEnemy);
      if(idxEnemy > -1) enemies.splice(idxEnemy, 1);
      let idxBoss = bosses.indexOf(currentEnemy);
      if(idxBoss > -1) bosses.splice(idxBoss, 1);
      
      if(idx === currentEnemy.qData.ans) {
        playSound('correct');
        // Correct - no life lost, get a huge bonus
        score += 500;
      } else {
        playSound('hurt');
        // Wrong - lose 1 life
        lives--;
        spawnParticles(player.x+player.width/2, player.y+player.height/2, '#ff6b6b');
      }
      
      scoreEl.innerText = score;
      livesEl.innerText = lives;
      
      if(lives <= 0) {
        state = 'over';
        lcModal.style.display = 'none';
        overlay.innerHTML = `<h2 class="failed">GAME OVER</h2><p style="font-family:'Press Start 2P', monospace; margin-bottom:20px;">FINAL SCORE: ${score}</p><button class="btn-play" onclick="startGame()">TRY AGAIN</button>`;
        overlay.style.display = 'flex';
      } else {
        state = 'playing';
        lcModal.style.display = 'none';
        invulnTimer = 120; // 2 seconds of invulnerability after question
      }
    }

    

    function update() {
      if(state !== 'playing') return;
      
      // Update background scroll
      bgOffsetY += 2;
      if(bgOffsetY >= canvas.height) bgOffsetY = 0;

      // Move player with WASD
      if((keys['keyw'] || keys['arrowup']) && player.y > 80) player.y -= player.speed;
      if((keys['keys'] || keys['arrowdown']) && player.y < canvas.height - player.height) player.y += player.speed;
      if((keys['keya'] || keys['arrowleft']) && player.x > 0) player.x -= player.speed;
      if((keys['keyd'] || keys['arrowright']) && player.x < canvas.width - player.width) player.x += player.speed;

      // Auto Shoot
      if(player.cooldown > 0) player.cooldown--;
      if(player.cooldown === 0) {
        playSound('laser');
        let numBullets = player.weaponLevel + 1; // Level 1 -> 2 bullets, Level 8 -> 9 bullets
        let spreadAngle = 0.15; // angle spread per bullet for higher levels
        for(let i=0; i<numBullets; i++) {
           let offset = (i - (numBullets-1)/2); // center is 0
           let isOuter = Math.abs(offset) > 1;
           
           // If we have many bullets, fan them out
           let vx = 0;
           let vy = -20;
           if(numBullets >= 4) {
              vx = offset * 2.5; 
           }
           
           let bWidth = player.weaponLevel >= 3 ? 8 : 6;
           let bHeight = player.weaponLevel >= 3 ? 35 : 30;
           
           bullets.push({ 
             x: player.x + player.width/2 - bWidth/2 + offset*10, 
             y: player.y + 10 + Math.abs(offset)*5, 
             width: bWidth, height: bHeight, 
             speedY: vy, speedX: vx 
           });
        }
        player.cooldown = player.fireRate;
      }

      // Update bullets
      bullets.forEach(b => { b.y += b.speedY; if(b.speedX) b.x += b.speedX; });
      bullets = bullets.filter(b => b.y > 0 && b.x > 0 && b.x < canvas.width);

      // Invuln timer
      if(invulnTimer > 0) invulnTimer--;

      // Spawn and update enemies
      spawnEnemy();
      for(let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += e.speedY;
        e.x += e.speedX;
        
        // Bounce off walls
        if(e.x < 0 || e.x + e.width > canvas.width) e.speedX *= -1;

        // Collision with player (Only if not invulnerable)
        if(invulnTimer <= 0) {
          if(e.x < player.x + player.width && e.x + e.width > player.x &&
             e.y < player.y + player.height && e.y + e.height > player.y) {
             triggerLeetCode(e);
             return; // pause game loop for question
          }
        }
        
        // Collision with bullet
        for(let j=bullets.length-1; j>=0; j--) {
          let b = bullets[j];
          if(b.x < e.x + e.width && b.x + b.width > e.x &&
             b.y < e.y + e.height && b.y + b.height > e.y) {
             bullets.splice(j, 1);
             e.hp--;
             spawnParticles(b.x, b.y, 'var(--mint)');
             if(e.hp <= 0) {
               playSound('explosion');
               enemies.splice(i, 1);
               score += 50;
               scoreEl.innerText = score;
               spawnParticles(e.x + e.width/2, e.y + e.height/2, e.color);
               spawnPowerup(e.x + e.width/2, e.y + e.height/2);
             }
             break;
          }
        }
      }
      
      // Update Traps
      for (let i = traps.length - 1; i >= 0; i--) {
         let t = traps[i];
         if (t.warnTimer > 0) {
            t.warnTimer--;
            if (t.warnTimer === 0) playSound('laser');
         } else if (t.activeTimer > 0) {
            t.activeTimer--;
            // Check collision with player
            if (invulnTimer <= 0) {
               if (t.isHorizontal) {
                  if (player.y < t.pos + t.thickness/2 && player.y + player.height > t.pos - t.thickness/2) {
                     lives--;
                     livesEl.innerText = lives;
                     spawnParticles(player.x+player.width/2, player.y+player.height/2, '#ff6b6b');
                     if(lives <= 0) {
                        state = 'over';
                        lcModal.style.display = 'none';
                        overlay.innerHTML = `<h2 class="failed">GAME OVER</h2><p style="font-family:'Press Start 2P', monospace; margin-bottom:20px;">FINAL SCORE: ${score}</p><button class="btn-play" onclick="startGame()">TRY AGAIN</button>`;
                        overlay.style.display = 'flex';
                     } else {
                        invulnTimer = 120;
                     }
                     return;
                  }
               } else {
                  if (player.x < t.pos + t.thickness/2 && player.x + player.width > t.pos - t.thickness/2) {
                     lives--;
                     livesEl.innerText = lives;
                     spawnParticles(player.x+player.width/2, player.y+player.height/2, '#ff6b6b');
                     if(lives <= 0) {
                        state = 'over';
                        lcModal.style.display = 'none';
                        overlay.innerHTML = `<h2 class="failed">GAME OVER</h2><p style="font-family:'Press Start 2P', monospace; margin-bottom:20px;">FINAL SCORE: ${score}</p><button class="btn-play" onclick="startGame()">TRY AGAIN</button>`;
                        overlay.style.display = 'flex';
                     } else {
                        invulnTimer = 120;
                     }
                     return;
                  }
               }
            }
         } else {
            traps.splice(i, 1);
         }
      }

      // Update Bosses
      isBossActive = bosses.length > 0;
      for (let i = bosses.length - 1; i >= 0; i--) {
         let b = bosses[i];
         b.x += b.speedX;
         b.y += b.speedY;
         
         if (b.y > 100) b.speedY = 0; // stop moving down
         if (b.x <= 0 || b.x + b.width >= canvas.width) b.speedX *= -1; // bounce walls
         
         // Boss collision with bullets
         for(let j=bullets.length-1; j>=0; j--) {
            let bl = bullets[j];
            if(bl.x < b.x + b.width && bl.x + bl.width > b.x && bl.y < b.y + b.height && bl.y + bl.height > b.y) {
               bullets.splice(j, 1);
               b.hp--;
               spawnParticles(bl.x, bl.y, '#feca57');
               if(b.hp <= 0) {
                  score += 2000;
                  scoreEl.innerText = score;
                  for(let k=0; k<10; k++) spawnPowerup(b.x + Math.random()*b.width, b.y + Math.random()*b.height); // massive loot
                  bosses.splice(i, 1);
                  break;
               }
            }
         }
         
         // Boss collision with player
         if (invulnTimer <= 0) {
            if (player.x < b.x + b.width && player.x + player.width > b.x && player.y < b.y + b.height && player.y + player.height > b.y) {
               triggerLeetCode(b);
               return;
            }
         }
         
         // Boss shooting bullets
         if (Math.random() < 0.05) { // 5% chance per frame
            bossBullets.push({
               x: b.x + b.width/2 - 10 + (Math.random()-0.5)*b.width,
               y: b.y + b.height - 20,
               width: 20, height: 20,
               speedY: 6 + Math.random()*3
            });
         }
      }

      // Update Boss Bullets
      for(let i=bossBullets.length-1; i>=0; i--) {
        let bb = bossBullets[i];
        bb.y += bb.speedY;
        if(bb.y > canvas.height) {
           bossBullets.splice(i, 1);
        } else if(invulnTimer <= 0) {
           if(player.x < bb.x + bb.width && player.x + player.width > bb.x && player.y < bb.y + bb.height && player.y + player.height > bb.y) {
              bossBullets.splice(i, 1);
              triggerLeetCode({ isBossBullet: true });
              return;
           }
        }
      }
      
      // Update Powerups
      for(let i=powerups.length-1; i>=0; i--) {
        let p = powerups[i];
        p.y += p.speed;
        
        // Collision with player
        if(Math.hypot(p.x - (player.x + player.width/2), p.y - (player.y + player.height/2)) < p.radius + player.width/2) {
           if(p.type === 'weapon') {
             if(player.weaponLevel < 8) player.weaponLevel++;
           } else if(p.type === 'life') {
             lives++;
             livesEl.innerText = lives;
           }
           spawnParticles(p.x, p.y, p.type === 'weapon' ? '#feca57' : '#66dec4');
           powerups.splice(i, 1);
        } else if(p.y > canvas.height) {
           powerups.splice(i, 1);
        }
      }
      
      // Clean offscreen enemies
      enemies = enemies.filter(e => e.y < canvas.height);

      // Update particles
      particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
      particles = particles.filter(p => p.life > 0);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Scrolling background
      if(bgImage.complete) {
        ctx.drawImage(bgImage, 0, bgOffsetY, canvas.width, canvas.height);
        ctx.drawImage(bgImage, 0, bgOffsetY - canvas.height, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#070910';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      
      // Darken a bit
      ctx.fillStyle = 'rgba(7, 9, 16, 0.5)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Player Ship
      if(invulnTimer === 0 || Math.floor(Date.now() / 100) % 2 === 0) {
        ctx.save();
        ctx.translate(player.x, player.y);
        
        // Engine Glow
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff9f43';
        ctx.fillStyle = '#ff9f43';
        ctx.beginPath();
        ctx.moveTo(30, 50); 
        ctx.lineTo(20, 70 + Math.random()*15); 
        ctx.lineTo(40, 70 + Math.random()*15);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Ship Body - Sleek Metallic Fighter
        ctx.fillStyle = '#b0b8c4'; // metallic gray
        ctx.strokeStyle = '#66dec4';
        ctx.lineWidth = 2;
        
        // Main fuselage
        ctx.beginPath();
        ctx.moveTo(30, 0); // nose
        ctx.lineTo(40, 20); // right nose
        ctx.lineTo(45, 50); // right body
        ctx.lineTo(30, 45); // back center
        ctx.lineTo(15, 50); // left body
        ctx.lineTo(20, 20); // left nose
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Wings
        ctx.fillStyle = '#1a1e29'; // dark wing
        ctx.beginPath();
        ctx.moveTo(40, 25);
        ctx.lineTo(60, 45); // right wing tip
        ctx.lineTo(60, 55);
        ctx.lineTo(45, 45);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(20, 25);
        ctx.lineTo(0, 45); // left wing tip
        ctx.lineTo(0, 55);
        ctx.lineTo(15, 45);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Cockpit
        ctx.fillStyle = '#66dec4'; // glowing mint cockpit
        ctx.beginPath();
        ctx.ellipse(30, 25, 5, 12, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
      }

      // Bullets
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#66dec4';
      bullets.forEach(b => {
        // Core
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.width, b.height, 4);
        ctx.fill();
        // Glow border
        ctx.strokeStyle = '#66dec4';
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x - 2, b.y - 2, b.width + 4, b.height + 4);
      });
      ctx.shadowBlur = 0;

      // Enemies
      enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        // UFO shape - Purple disc with green thruster
        ctx.fillStyle = '#8d73ff'; // purple body
        ctx.ellipse(e.x + e.width/2, e.y + e.height/2, e.width/2, e.height/3, 0, 0, Math.PI*2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.fillStyle = '#1a1e29'; // dark dome
        ctx.ellipse(e.x + e.width/2, e.y + e.height/2 - 5, e.width/3, e.height/4, 0, Math.PI, 0);
        ctx.fill();

        // Green glowing thrusters
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#66dec4';
        ctx.fillStyle = '#66dec4';
        ctx.beginPath();
        ctx.arc(e.x + e.width/4, e.y + e.height - 10, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(e.x + e.width*3/4, e.y + e.height - 10, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Traps
      traps.forEach(t => {
         if (t.warnTimer > 0) {
            // Warning line
            ctx.fillStyle = (Math.floor(Date.now() / 100) % 2 === 0) ? '#ff6b6b' : 'transparent';
            ctx.globalAlpha = 0.5;
            if (t.isHorizontal) ctx.fillRect(0, t.pos - 2, canvas.width, 4);
            else ctx.fillRect(t.pos - 2, 0, 4, canvas.height);
            ctx.globalAlpha = 1;
         } else if (t.activeTimer > 0) {
            // Active Laser
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ff6b6b';
            ctx.fillStyle = '#ffffff';
            if (t.isHorizontal) ctx.fillRect(0, t.pos - t.thickness/2, canvas.width, t.thickness);
            else ctx.fillRect(t.pos - t.thickness/2, 0, t.thickness, canvas.height);
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = 'rgba(255, 107, 107, 0.5)';
            if (t.isHorizontal) ctx.fillRect(0, t.pos - t.thickness/2 - 10, canvas.width, t.thickness + 20);
            else ctx.fillRect(t.pos - t.thickness/2 - 10, 0, t.thickness + 20, canvas.height);
         }
      });

      // Bosses
      bosses.forEach(b => {
         ctx.save();
         ctx.translate(b.x, b.y);
         
         // Boss aura
         ctx.shadowBlur = 40;
         ctx.shadowColor = '#ff6b6b';
         
         // Huge UFO
         ctx.fillStyle = '#2c3e50';
         ctx.beginPath();
         ctx.ellipse(b.width/2, b.height/2, b.width/2, b.height/3, 0, 0, Math.PI*2);
         ctx.fill();
         
         ctx.beginPath();
         ctx.fillStyle = '#1a1e29';
         ctx.ellipse(b.width/2, b.height/2 - 15, b.width/3, b.height/4, 0, Math.PI, 0);
         ctx.fill();
         
         // Core eye
         ctx.fillStyle = '#ff6b6b';
         ctx.beginPath();
         ctx.arc(b.width/2, b.height/2, 20, 0, Math.PI*2);
         ctx.fill();
         ctx.shadowBlur = 0;
         
         // Health bar
         ctx.fillStyle = '#ff6b6b';
         ctx.fillRect(b.width*0.1, -20, b.width*0.8 * (b.hp / b.maxHp), 8);
         ctx.strokeStyle = '#fff';
         ctx.strokeRect(b.width*0.1, -20, b.width*0.8, 8);
         
         ctx.restore();
      });

      // Boss Bullets (Red Orbs)
      bossBullets.forEach(bb => {
         ctx.fillStyle = '#ff6b6b';
         ctx.shadowBlur = 15;
         ctx.shadowColor = '#ff6b6b';
         ctx.beginPath();
         ctx.arc(bb.x + bb.width/2, bb.y + bb.height/2, bb.width/2, 0, Math.PI*2);
         ctx.fill();
         ctx.shadowBlur = 0;
      });

      // Powerups
      powerups.forEach(p => {
         ctx.save();
         ctx.translate(p.x, p.y);
         ctx.shadowBlur = 15;
         ctx.shadowColor = p.type === 'weapon' ? '#feca57' : '#ff6b6b';
         ctx.fillStyle = p.type === 'weapon' ? '#feca57' : '#ff6b6b';
         
         ctx.beginPath();
         ctx.arc(0, 0, p.radius, 0, Math.PI*2);
         ctx.fill();
         ctx.shadowBlur = 0;
         
         ctx.fillStyle = '#1a1e29';
         ctx.font = 'bold 16px Inter, sans-serif';
         ctx.textAlign = 'center';
         ctx.textBaseline = 'middle';
         ctx.fillText(p.type === 'weapon' ? 'W' : '♥', 0, 0);
         
         ctx.restore();
      });

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 40;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
