<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Developer's Journey 3D — Duy Hoàng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=2">
  <link rel="icon" type="image/jpeg" href="assets/img/favicon.jpg">
  <style>
    body { background: #070910; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; width: 100vw; height: 100vh; }
    .nav { position: fixed; top: 0; width: 100%; z-index: 100; }
    
    #game-container { width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    
    #ui { position: absolute; top: 80px; left: 20px; font-family: 'Press Start 2P', monospace; font-size: 16px; text-shadow: 2px 2px 0 #000; z-index: 5; pointer-events: none; display:flex; justify-content:space-between; width:calc(100% - 40px);}
    .val { color: var(--mint); }
    
    /* Overlay for menu / game over */
    #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    #overlay h2 { font-size: 48px; color: var(--mint); margin-bottom: 20px; font-family: 'Press Start 2P', monospace; text-shadow: 0 0 20px var(--mint); text-align:center; line-height:1.4;}
    #overlay h2.failed { color: #ff6b6b; text-shadow: 0 0 20px #ff6b6b; }
    .btn-play { background: var(--mint); color: #000; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; font-family: 'Press Start 2P', monospace; margin-top:20px;}
    .btn-play:hover { background: #fff; transform: scale(1.05); }

    /* LeetCode Modal */
    #leetcode-modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 20; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .lc-box { background: #1a1e29; border: 2px solid var(--purple); border-radius: 12px; padding: 30px; max-width: 600px; width: 100%; }
    .lc-box h3 { color: var(--purple); font-family: 'Press Start 2P', monospace; font-size: 18px; margin-top: 0; margin-bottom: 20px; }
    .lc-question { font-size: 16px; line-height: 1.6; margin-bottom: 25px; color: #c8d0dc; font-family: monospace; }
    .lc-options { display: flex; flex-direction: column; gap: 10px; }
    .lc-opt-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 15px; border-radius: 8px; cursor: pointer; font-family: monospace; font-size: 14px; text-align: left; transition: 0.2s; }
    .lc-opt-btn:hover { background: rgba(141,115,255,0.2); border-color: var(--purple); }
  </style>
</head>
<body>
  <nav class="nav" style="background: rgba(7,9,16,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05);"><div class="container nav-inner">
    <a class="brand" href="journey.html"><i class="fa-solid fa-arrow-left"></i> &nbsp; Back to Journey</a>
  </div></nav>
  
  <div id="game-container">
    <div id="ui">
      <div>EXP: <span id="score" class="val">0</span></div>
      <div>LIVES: <span id="lives" class="val" style="color:#ff6b6b">3</span></div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="overlay">
      <h2>CYBER CITY SURVIVAL</h2>
      <p style="margin-bottom: 30px; font-family: monospace; font-size: 18px; color: #c8d0dc;">Use W A S D to explore the city.</p>
      <button class="btn-play" onclick="startGame()">START JOURNEY</button>
    </div>

    <div id="leetcode-modal">
      <div class="lc-box">
        <h3>🚨 BUG ENCOUNTERED! 🚨</h3>
        <div class="lc-question" id="lc-q">Question text goes here.</div>
        <div class="lc-options" id="lc-options">
          <!-- Options injected by JS -->
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const lcModal = document.getElementById('leetcode-modal');

    // Resize canvas to full window
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Background Image
    const bgImage = new Image();
    bgImage.src = 'assets/img/bg_topdown_cybercity.jpg';

    // Leetcode Questions Database
        const leetcodeDB = [
      { q: "What is the time complexity of searching an element in a balanced Binary Search Tree?", opts: ["O(1)", "O(n)", "O(log n)", "O(n log n)"], ans: 2 },
      { q: "Which data structure uses LIFO (Last In First Out)?", opts: ["Queue", "Stack", "Array", "Linked List"], ans: 1 },
      { q: "In Node.js, what handles asynchronous operations?", opts: ["Thread Pool", "Event Loop", "V8 Engine", "DOM"], ans: 1 },
      { q: "Which SQL clause is used to filter records after GROUP BY?", opts: ["WHERE", "ORDER BY", "HAVING", "FILTER"], ans: 2 },
      { q: "What is the space complexity of quicksort in the best case?", opts: ["O(1)", "O(log n)", "O(n)", "O(n^2)"], ans: 1 },
      { q: "What does CSS stand for?", opts: ["Cascading Style Sheets", "Computer Style Sheets", "Creative Style Sheets", "Colorful Style Sheets"], ans: 0 },
      { q: "Which HTTP method is idempotent?", opts: ["POST", "PATCH", "PUT", "CONNECT"], ans: 2 },
      { q: "What is a closure in JavaScript?", opts: ["A function bundled with its lexical environment", "A closed browser tab", "A private class variable", "A loop condition"], ans: 0 },
      { q: "Which React hook is used for side effects?", opts: ["useState", "useEffect", "useMemo", "useRef"], ans: 1 },
      { q: "What is the Big-O for checking if a key exists in a Hash Map?", opts: ["O(1)", "O(n)", "O(log n)", "O(n^2)"], ans: 0 },
      { q: "What is the primary function of a reverse proxy?", opts: ["To encrypt data", "To route client requests to servers", "To route server requests to clients", "To cache local memory"], ans: 1 },
      { q: "Which design pattern restricts a class to a single instance?", opts: ["Factory", "Observer", "Singleton", "Decorator"], ans: 2 },
      { q: "What is Git rebase used for?", opts: ["To delete a branch", "To merge without history", "To move a branch to a new base commit", "To undo a commit"], ans: 2 },
      { q: "Which property is used in CSS Flexbox to align items vertically?", opts: ["justify-content", "align-items", "flex-direction", "align-content"], ans: 1 },
      { q: "What does API stand for?", opts: ["Application Programming Interface", "Advanced Program Integration", "Automated Process Interface", "Application Process Integration"], ans: 0 },
      { q: "Which algorithm is commonly used for finding the shortest path?", opts: ["Bubble Sort", "Dijkstra's Algorithm", "Binary Search", "DFS"], ans: 1 },
      { q: "What is a Promise in JavaScript?", opts: ["A guaranteed loop", "An object representing eventual completion/failure", "A strict type checker", "A database query"], ans: 1 },
      { q: "Which command creates a new React app?", opts: ["npm run react", "npx create-react-app", "node init react", "npm install react-dom"], ans: 1 },
      { q: "What is the default port for HTTP?", opts: ["443", "8080", "80", "22"], ans: 2 },
      { q: "Which protocol is used for secure communication over the web?", opts: ["FTP", "HTTP", "HTTPS", "SMTP"], ans: 2 }
    ];
    let availableQuestions = [];

    let state = 'menu'; // menu, playing, leetcode, over
    let score = 0;
    let lives = 3;
    
    // Map dimensions (much larger than screen)
    const mapWidth = 4000;
    const mapHeight = 4000;

    // Player
    const player = { x: 2000, y: 2000, size: 30, speed: 6 };
    
    // Camera
    const camera = { x: 0, y: 0 };
    
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.code.toLowerCase()] = false);

    let enemies = [];
    let currentEnemy = null;

    function generateEnemies() {
      enemies = [];
      for(let i=0; i<30; i++) {
        enemies.push({ 
          x: Math.random() * mapWidth, 
          y: Math.random() * mapHeight, 
          size: 35, 
          speed: 2 + Math.random() * 2,
          state: 'idle', // idle, chase
          alive: true
        });
      }
    }

    function startGame() {
      availableQuestions = [...leetcodeDB];
      state = 'playing';
      score = 0;
      lives = 3;
      scoreEl.innerText = score;
      livesEl.innerText = lives;
      overlay.style.display = 'none';
      lcModal.style.display = 'none';
      
      player.x = mapWidth / 2;
      player.y = mapHeight / 2;
      
      generateEnemies();
    }

    function checkAnswer(idx) {
      if(idx === currentEnemy.qData.ans) {
        // Correct
        score += 100;
        currentEnemy.ref.alive = false;
      } else {
        // Wrong
        lives--;
        currentEnemy.ref.alive = false;
      }
      
      scoreEl.innerText = score;
      livesEl.innerText = lives;
      
      if(lives <= 0) {
        gameOver();
      } else {
        state = 'playing';
        lcModal.style.display = 'none';
      }
    }

    function triggerLeetCode(enemy) {
      state = 'leetcode';
      if(availableQuestions.length === 0) availableQuestions = [...leetcodeDB];
      let rIdx = Math.floor(Math.random() * availableQuestions.length);
      let qData = availableQuestions[rIdx];
      availableQuestions.splice(rIdx, 1);
      currentEnemy = { ref: enemy, qData: qData };
      
      document.getElementById('lc-q').innerText = qData.q;
      let optsHtml = '';
      qData.opts.forEach((opt, i) => {
        optsHtml += `<button class="lc-opt-btn" onclick="checkAnswer(${i})">${['A','B','C','D'][i]}. ${opt}</button>`;
      });
      document.getElementById('lc-options').innerHTML = optsHtml;
      
      lcModal.style.display = 'flex';
    }

    function gameOver() {
      state = 'over';
      lcModal.style.display = 'none';
      overlay.innerHTML = `<h2 class="failed">FAILED</h2><p style="font-family:'Press Start 2P', monospace; margin-bottom:20px;">FINAL EXP: ${score}</p><button class="btn-play" onclick="startGame()">TRY AGAIN</button>`;
      overlay.style.display = 'flex';
    }

    function update() {
      if(state !== 'playing') return;

      // Move player with WASD
      if((keys['keyw'] || keys['arrowup']) && player.y > player.size) player.y -= player.speed;
      if((keys['keys'] || keys['arrowdown']) && player.y < mapHeight - player.size) player.y += player.speed;
      if((keys['keya'] || keys['arrowleft']) && player.x > player.size) player.x -= player.speed;
      if((keys['keyd'] || keys['arrowright']) && player.x < mapWidth - player.size) player.x += player.speed;

      // Update camera to center player
      camera.x = player.x - canvas.width / 2;
      camera.y = player.y - canvas.height / 2;

      // Clamp camera
      camera.x = Math.max(0, Math.min(camera.x, mapWidth - canvas.width));
      camera.y = Math.max(0, Math.min(camera.y, mapHeight - canvas.height));

      // Update enemies
      enemies.forEach(e => {
        if(e.alive) {
          let dx = player.x - e.x;
          let dy = player.y - e.y;
          let dist = Math.hypot(dx, dy);

          // Chase radius
          if(dist < 400) {
            e.state = 'chase';
            // Move towards player
            e.x += (dx / dist) * e.speed;
            e.y += (dy / dist) * e.speed;
          } else {
            e.state = 'idle';
            // Wander randomly (simplified)
            e.x += (Math.random() - 0.5) * 2;
            e.y += (Math.random() - 0.5) * 2;
          }

          // Keep in bounds
          e.x = Math.max(e.size, Math.min(e.x, mapWidth - e.size));
          e.y = Math.max(e.size, Math.min(e.y, mapHeight - e.size));

          // Collision with player
          if(dist < player.size + e.size) {
            triggerLeetCode(e);
          }
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if(state === 'menu' || state === 'over') {
        // Draw static bg for menu
        if(bgImage.complete) {
          ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
        }
        return;
      }

      ctx.save();
      // Move world opposite to camera
      ctx.translate(-camera.x, -camera.y);

      // Draw tiled background
      if(bgImage.complete) {
        // bgImage is 4k, just draw it covering the map
        ctx.drawImage(bgImage, 0, 0, mapWidth, mapHeight);
      } else {
        ctx.fillStyle = '#070910';
        ctx.fillRect(0, 0, mapWidth, mapHeight);
      }

      // Draw Map Boundary
      ctx.strokeStyle = 'var(--mint)';
      ctx.lineWidth = 10;
      ctx.strokeRect(0, 0, mapWidth, mapHeight);

      // Draw Grid (optional for 3D feel)
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      for(let x=0; x<mapWidth; x+=100) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,mapHeight); ctx.stroke(); }
      for(let y=0; y<mapHeight; y+=100) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(mapWidth,y); ctx.stroke(); }

      // Draw Enemies
      enemies.forEach(e => {
        if(e.alive) {
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.size, 0, Math.PI*2);
          ctx.fillStyle = e.state === 'chase' ? '#ff6b6b' : '#8d73ff';
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 3;
          ctx.stroke();

          // Bug eyes
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(e.x - 10, e.y - 10, 6, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(e.x + 10, e.y - 10, 6, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#000';
          ctx.beginPath(); ctx.arc(e.x - 10, e.y - 10, 3, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(e.x + 10, e.y - 10, 3, 0, Math.PI*2); ctx.fill();
          
          // Alert symbol
          if(e.state === 'chase') {
            ctx.fillStyle = '#ff6b6b';
            ctx.font = "bold 24px monospace";
            ctx.fillText("!", e.x - 7, e.y - e.size - 10);
          }
        }
      });

      // Draw Player
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.size, 0, Math.PI*2);
      ctx.fillStyle = 'var(--mint)';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Player directional indicator (simple line showing facing)
      let faceX = 0, faceY = -1; // default up
      if(keys['keyw'] || keys['arrowup']) { faceX = 0; faceY = -1; }
      else if(keys['keys'] || keys['arrowdown']) { faceX = 0; faceY = 1; }
      else if(keys['keya'] || keys['arrowleft']) { faceX = -1; faceY = 0; }
      else if(keys['keyd'] || keys['arrowright']) { faceX = 1; faceY = 0; }
      
      ctx.beginPath();
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(player.x + faceX * player.size * 1.5, player.y + faceY * player.size * 1.5);
      ctx.strokeStyle = 'var(--purple)';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
