<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cyber Gold Miner — Duy Hoàng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=2">
  <link rel="icon" type="image/jpeg" href="assets/img/favicon.jpg">
  <style>
    body { background: #070910; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; width: 100vw; height: 100vh; }
    .nav { position: fixed; top: 0; width: 100%; z-index: 100; }
    
    #game-container { width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    
    #ui { position: absolute; top: 80px; left: 20px; font-family: 'Press Start 2P', monospace; font-size: 16px; text-shadow: 2px 2px 0 #000; z-index: 5; pointer-events: none; display:flex; flex-direction:column; gap:15px; }
    .val { color: var(--purple); }
    
    #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    #overlay h2 { font-size: 48px; color: var(--purple); margin-bottom: 20px; font-family: 'Press Start 2P', monospace; text-shadow: 0 0 20px var(--purple); text-align:center; line-height:1.4;}
    .btn-play { background: var(--purple); color: #fff; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; font-family: 'Press Start 2P', monospace; margin-top:20px;}
    .btn-play:hover { background: #705ad4; transform: scale(1.05); }

    /* LeetCode Modal */
    #leetcode-modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 20; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .lc-box { background: #1a1e29; border: 2px solid var(--purple); border-radius: 12px; padding: 30px; max-width: 600px; width: 100%; }
    .lc-box h3 { color: var(--purple); font-family: 'Press Start 2P', monospace; font-size: 18px; margin-top: 0; margin-bottom: 20px; }
    .lc-question { font-size: 16px; line-height: 1.6; margin-bottom: 25px; color: #c8d0dc; font-family: monospace; }
    .lc-options { display: flex; flex-direction: column; gap: 10px; }
    .lc-opt-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 15px; border-radius: 8px; cursor: pointer; font-family: monospace; font-size: 14px; text-align: left; transition: 0.2s; }
    .lc-opt-btn:hover { background: rgba(141,115,255,0.2); border-color: var(--purple); }
  </style>
</head>
<body>
  <nav class="nav" style="background: rgba(7,9,16,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05);"><div class="container nav-inner">
    <a class="brand" href="journey.html"><i class="fa-solid fa-arrow-left"></i> &nbsp; Back to Journey</a>
  </div></nav>
  
  <div id="game-container">
    <div id="ui">
      <div>SCORE: <span id="score" class="val">0</span></div>
      <div>TIME: <span id="time" class="val">60</span></div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="overlay">
      <h2>CYBER MINER</h2>
      <p style="margin-bottom: 30px; font-family: monospace; font-size: 18px; color: #feca57; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; border: 1px solid #feca57;">🎮 Hướng dẫn: Bấm SPACE hoặc Mũi tên XUỐNG để thả ngàm kẹp!</p>
      <button class="btn-play" onclick="startGame()">PLAY NOW</button>
    </div>

    <div id="leetcode-modal">
      <div class="lc-box">
        <h3>🚨 RED GEM ANOMALY 🚨</h3>
        <div class="lc-question" id="lc-q">Question text goes here.</div>
        <div class="lc-options" id="lc-options"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const overlay = document.getElementById('overlay');
    const lcModal = document.getElementById('leetcode-modal');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const bgImage = new Image();
    bgImage.src = 'assets/img/bg_cave_miner.jpg';

    // Leetcode Questions Database
        const leetcodeDB = [
      { q: "What is the time complexity of searching an element in a balanced Binary Search Tree?", opts: ["O(1)", "O(n)", "O(log n)", "O(n log n)"], ans: 2 },
      { q: "Which data structure uses LIFO (Last In First Out)?", opts: ["Queue", "Stack", "Array", "Linked List"], ans: 1 },
      { q: "In Node.js, what handles asynchronous operations?", opts: ["Thread Pool", "Event Loop", "V8 Engine", "DOM"], ans: 1 },
      { q: "Which SQL clause is used to filter records after GROUP BY?", opts: ["WHERE", "ORDER BY", "HAVING", "FILTER"], ans: 2 },
      { q: "What is the space complexity of quicksort in the best case?", opts: ["O(1)", "O(log n)", "O(n)", "O(n^2)"], ans: 1 },
      { q: "What does CSS stand for?", opts: ["Cascading Style Sheets", "Computer Style Sheets", "Creative Style Sheets", "Colorful Style Sheets"], ans: 0 },
      { q: "Which HTTP method is idempotent?", opts: ["POST", "PATCH", "PUT", "CONNECT"], ans: 2 },
      { q: "What is a closure in JavaScript?", opts: ["A function bundled with its lexical environment", "A closed browser tab", "A private class variable", "A loop condition"], ans: 0 },
      { q: "Which React hook is used for side effects?", opts: ["useState", "useEffect", "useMemo", "useRef"], ans: 1 },
      { q: "What is the Big-O for checking if a key exists in a Hash Map?", opts: ["O(1)", "O(n)", "O(log n)", "O(n^2)"], ans: 0 },
      { q: "What is the primary function of a reverse proxy?", opts: ["To encrypt data", "To route client requests to servers", "To route server requests to clients", "To cache local memory"], ans: 1 },
      { q: "Which design pattern restricts a class to a single instance?", opts: ["Factory", "Observer", "Singleton", "Decorator"], ans: 2 },
      { q: "What is Git rebase used for?", opts: ["To delete a branch", "To merge without history", "To move a branch to a new base commit", "To undo a commit"], ans: 2 },
      { q: "Which property is used in CSS Flexbox to align items vertically?", opts: ["justify-content", "align-items", "flex-direction", "align-content"], ans: 1 },
      { q: "What does API stand for?", opts: ["Application Programming Interface", "Advanced Program Integration", "Automated Process Interface", "Application Process Integration"], ans: 0 },
      { q: "Which algorithm is commonly used for finding the shortest path?", opts: ["Bubble Sort", "Dijkstra's Algorithm", "Binary Search", "DFS"], ans: 1 },
      { q: "What is a Promise in JavaScript?", opts: ["A guaranteed loop", "An object representing eventual completion/failure", "A strict type checker", "A database query"], ans: 1 },
      { q: "Which command creates a new React app?", opts: ["npm run react", "npx create-react-app", "node init react", "npm install react-dom"], ans: 1 },
      { q: "What is the default port for HTTP?", opts: ["443", "8080", "80", "22"], ans: 2 },
      { q: "Which protocol is used for secure communication over the web?", opts: ["FTP", "HTTP", "HTTPS", "SMTP"], ans: 2 }
    ];
    let availableQuestions = [];

    let state = 'menu'; // menu, playing, leetcode, over
    let score = 0;
    let time = 60;
    let timerInterval = null;
    let currentQuestion = null;
    let floatingTexts = [];
    let isClawPaused = false;

    // Claw logic
    const claw = {
      x: canvas.width / 2, y: 100, angle: Math.PI/2, speed: 0.02, dir: 1, 
      state: 'swing', // swing, shoot, retract
      length: 0, maxLength: 3000, shootSpeed: 15, retractSpeed: 15,
      itemHit: null
    };

    // Items
    let items = [];
    const colors = ['#66dec4', '#8d73ff', '#ff6b6b', '#feca57']; // mint, purple, red, yellow
    
    function spawnItems() {
      items = [];
      const numItems = Math.floor(canvas.width / 50); // scales with screen size
      for(let i=0; i<numItems; i++) {
        const rand = Math.random();
        let type, color, radius;
        if(rand < 0.2) { // 20% Anomaly
          type = 'anomaly'; color = '#ff6b6b'; radius = 20 + Math.random() * 20;
        } else if(rand < 0.5) { // 30% Gold
          type = 'gold'; color = '#feca57'; radius = 20 + Math.random() * 30;
        } else if(rand < 0.8) { // 30% Gem
          type = 'gem'; color = Math.random() > 0.5 ? '#66dec4' : '#8d73ff'; radius = 15 + Math.random() * 15;
        } else { // 20% Rock
          type = 'rock'; color = '#4a5568'; radius = 40 + Math.random() * 40;
        }
        
        let value = 0;
        if(type === 'gold') value = Math.floor(1000 / radius) * 10;
        if(type === 'gem') value = 300 + Math.floor(Math.random() * 200);
        if(type === 'anomaly') value = 500;
        if(type === 'rock') value = 20;

        // Give them a random rotation offset for drawing
        const rot = Math.random() * Math.PI * 2;
        // Generate random polygon points
        const points = [];
        const numPoints = type === 'gem' ? 6 : (type === 'gold' ? 8 : 10);
        for(let j=0; j<numPoints; j++) {
           let angle = (j / numPoints) * Math.PI * 2;
           // Gems are perfectly geometric, rocks/gold are jagged
           let dist = type === 'gem' ? radius : radius * (0.7 + Math.random() * 0.3);
           points.push({x: Math.cos(angle)*dist, y: Math.sin(angle)*dist});
        }

        items.push({
          x: 100 + Math.random() * (canvas.width - 200),
          y: 250 + Math.random() * (canvas.height - 300),
          radius, color, type, value, rot, points,
          isAnomaly: type === 'anomaly'
        });
      }
    }

    function resetClaw() {
      claw.x = canvas.width / 2;
      claw.maxLength = 3000;
      claw.state = 'swing';
      claw.length = 0;
      claw.itemHit = null;
      claw.retractSpeed = 15;
    }

    function startGame() {
      availableQuestions = [...leetcodeDB];
      state = 'playing';
      score = 0;
      time = 60;
      scoreEl.innerText = score;
      timeEl.innerText = time;
      overlay.style.display = 'none';
      lcModal.style.display = 'none';
      
      spawnItems();
      resetClaw();
      
      if(timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if(state === 'playing') {
          time--;
          timeEl.innerText = time;
          if(time <= 0) endGame();
        }
      }, 1000);
    }

    function endGame() {
      state = 'over';
      clearInterval(timerInterval);
      overlay.innerHTML = `<h2>GAME OVER</h2><p style="font-family:'Press Start 2P', monospace; margin-bottom:20px;">FINAL SCORE: ${score}</p><button class="btn-play" onclick="startGame()">PLAY AGAIN</button>`;
      overlay.style.display = 'flex';
    }

    function triggerLeetCode() {
      state = 'leetcode';
      if(availableQuestions.length === 0) availableQuestions = [...leetcodeDB];
      let rIdx = Math.floor(Math.random() * availableQuestions.length);
      let qData = availableQuestions[rIdx];
      availableQuestions.splice(rIdx, 1);
      currentQuestion = qData;
      
      document.getElementById('lc-q').innerText = qData.q;
      let optsHtml = '';
      qData.opts.forEach((opt, i) => {
        optsHtml += `<button class="lc-opt-btn" onclick="checkAnswer(${i})">${['A','B','C','D'][i]}. ${opt}</button>`;
      });
      document.getElementById('lc-options').innerHTML = optsHtml;
      
      lcModal.style.display = 'flex';
    }

    function checkAnswer(idx) {
      if(idx === currentQuestion.ans) {
        time += 15; // Correct
        floatingTexts.push({ x: claw.x, y: claw.y + claw.length, text: '+15s', color: '#66dec4', life: 80 });
      } else {
        time -= 15; // Wrong
        floatingTexts.push({ x: claw.x, y: claw.y + claw.length, text: '-15s', color: '#ff6b6b', life: 80 });
      }
      
      timeEl.innerText = time;
      state = 'playing';
      lcModal.style.display = 'none';
      
      if(time <= 0) endGame();
    }

    window.addEventListener('keydown', (e) => {
      if(e.code === 'Space' && state === 'playing' && claw.state === 'swing') {
        claw.state = 'shoot';
      }
    });

    canvas.addEventListener('mousedown', () => {
      if(state === 'playing' && claw.state === 'swing') {
        claw.state = 'shoot';
      }
    });

    function update() {
      if(state !== 'playing') return;
      
      floatingTexts.forEach(ft => { ft.y -= 1; ft.life--; });
      floatingTexts = floatingTexts.filter(ft => ft.life > 0);
      
      // Keep claw centered on resize
      claw.x = canvas.width / 2;

      if(claw.state === 'swing') {
        claw.angle += claw.speed * claw.dir;
        if(claw.angle > Math.PI - 0.2 || claw.angle < 0.2) claw.dir *= -1;
      } else if(claw.state === 'shoot') {
        claw.length += claw.shootSpeed;
        if(claw.length > claw.maxLength) {
          claw.state = 'retract';
        } else {
          // Check collision
          const tipX = claw.x + Math.cos(claw.angle) * claw.length;
          const tipY = claw.y + Math.sin(claw.angle) * claw.length;
          
          if(tipX < 0 || tipX > canvas.width || tipY > canvas.height) {
            claw.state = 'retract';
          } else {
            for(let i=0; i<items.length; i++) {
              const it = items[i];
              const dist = Math.hypot(tipX - it.x, tipY - it.y);
              if(dist < it.radius) {
                claw.itemHit = it;
                claw.state = 'retract';
                // Big items (large radius) retract very slowly, small items retract fast
                claw.retractSpeed = Math.max(1.5, 16 - it.radius / 2.5);
                items.splice(i, 1);
                
                // If it's a red gem anomaly, trigger question immediately
                if(it.isAnomaly) {
                  triggerLeetCode();
                }
                break;
              }
            }
          }
        }
      } else if(claw.state === 'retract') {
        claw.length -= claw.retractSpeed;
        if(claw.length <= 0) {
          if(claw.itemHit) {
            score += claw.itemHit.value;
            scoreEl.innerText = score;
            if(!claw.itemHit.isAnomaly) {
              floatingTexts.push({
                x: claw.x,
                y: 110,
                text: '+' + claw.itemHit.value,
                color: '#feca57',
                life: 60
              });
            }
          }
          resetClaw();
        }
      }
    }

    function drawItem(it, ctx) {
        ctx.save();
        ctx.rotate(it.rot);
        
        ctx.beginPath();
        ctx.moveTo(it.points[0].x, it.points[0].y);
        for(let j=1; j<it.points.length; j++) {
          ctx.lineTo(it.points[j].x, it.points[j].y);
        }
        ctx.closePath();
        
        // Dynamic gradients
        if(it.type === 'gold') {
           let grd = ctx.createRadialGradient(0, -it.radius/4, 0, 0, 0, it.radius);
           grd.addColorStop(0, '#fff200');
           grd.addColorStop(1, '#e1b12c');
           ctx.fillStyle = grd;
        } else if(it.type === 'rock') {
           let grd = ctx.createRadialGradient(0, -it.radius/4, 0, 0, 0, it.radius);
           grd.addColorStop(0, '#718093');
           grd.addColorStop(1, '#2f3640');
           ctx.fillStyle = grd;
        } else if(it.type === 'gem') {
           let grd = ctx.createLinearGradient(-it.radius, -it.radius, it.radius, it.radius);
           grd.addColorStop(0, '#00d8d6');
           grd.addColorStop(1, '#0fb9b1');
           ctx.fillStyle = grd;
           ctx.shadowBlur = 15;
           ctx.shadowColor = '#00d8d6';
        } else if(it.type === 'anomaly') {
           let grd = ctx.createRadialGradient(0, 0, 0, 0, 0, it.radius);
           grd.addColorStop(0, '#ffffff');
           grd.addColorStop(0.2, '#ff3f34');
           grd.addColorStop(1, '#8c7ae6'); 
           ctx.fillStyle = grd;
           ctx.shadowBlur = 20;
           ctx.shadowColor = '#ff3f34';
        }

        ctx.fill();
        ctx.shadowBlur = 0; 
        
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
        
        // Inner tech/facet lines
        ctx.beginPath();
        if(it.type === 'gem' || it.type === 'anomaly') {
          // Crystal facets
          ctx.moveTo(0, -it.radius); ctx.lineTo(0, it.radius);
          ctx.moveTo(-it.radius, 0); ctx.lineTo(it.radius, 0);
          ctx.moveTo(-it.radius/2, -it.radius/2); ctx.lineTo(it.radius/2, it.radius/2);
        } else if(it.type === 'gold') {
          // Gold shine
          ctx.moveTo(-it.radius*0.4, -it.radius*0.4); 
          ctx.lineTo(-it.radius*0.1, -it.radius*0.4);
          ctx.lineTo(-it.radius*0.2, -it.radius*0.1);
        } else if(it.type === 'rock') {
          // Craters
          ctx.moveTo(-it.radius*0.3, -it.radius*0.2); ctx.lineTo(0, -it.radius*0.4);
          ctx.moveTo(it.radius*0.2, it.radius*0.1); ctx.lineTo(it.radius*0.4, -it.radius*0.1);
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = it.type==='gold'? 3 : 1.5;
        ctx.stroke();

        ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if(bgImage.complete) {
        // Draw bg to cover whole screen
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#070910';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Darken background slightly
      ctx.fillStyle = 'rgba(7, 9, 16, 0.4)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw items
      items.forEach(it => {
        ctx.save();
        ctx.translate(it.x, it.y);
        drawItem(it, ctx);
        ctx.restore();
      });

      // Draw claw machine base
      ctx.fillStyle = '#1a1e29';
      ctx.fillRect(claw.x - 30, 70, 60, 40);
      ctx.strokeStyle = 'var(--purple)';
      ctx.lineWidth = 2;
      ctx.strokeRect(claw.x - 30, 70, 60, 40);

      // Draw line (Grey cable)
      const tipX = claw.x + Math.cos(claw.angle) * claw.length;
      const tipY = claw.y + Math.sin(claw.angle) * claw.length;
      
      ctx.beginPath();
      ctx.moveTo(claw.x, claw.y);
      ctx.lineTo(tipX, tipY);
      ctx.strokeStyle = '#7f8fa6'; // Strong grey cable
      ctx.lineWidth = 4;
      ctx.stroke();

      // Draw claw tip (Real Mechanical)
      ctx.save();
      ctx.translate(tipX, tipY);
      ctx.rotate(claw.angle - Math.PI/2);
      
      // Top housing
      ctx.fillStyle = '#353b48';
      ctx.beginPath();
      ctx.roundRect(-20, 0, 40, 18, 5);
      ctx.fill();
      
      // Yellow warning stripe
      ctx.fillStyle = '#e1b12c';
      ctx.fillRect(-20, 8, 40, 4);

      // Prongs
      let prongAngle = claw.itemHit ? 0.3 : 0.8; // closed if hit, open if not
      
      // Left prong
      ctx.save();
      ctx.translate(-15, 18);
      ctx.rotate(prongAngle);
      ctx.fillStyle = '#718093';
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(-10, 20); ctx.lineTo(5, 25); ctx.lineTo(10, 0);
      ctx.fill();
      // Sharp tip
      ctx.fillStyle = '#f5f6fa';
      ctx.beginPath(); ctx.moveTo(-10,20); ctx.lineTo(5,35); ctx.lineTo(5,25); ctx.fill();
      ctx.restore();
      
      // Right prong
      ctx.save();
      ctx.translate(15, 18);
      ctx.rotate(-prongAngle);
      ctx.fillStyle = '#718093';
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(10, 20); ctx.lineTo(-5, 25); ctx.lineTo(-10, 0);
      ctx.fill();
      // Sharp tip
      ctx.fillStyle = '#f5f6fa';
      ctx.beginPath(); ctx.moveTo(10,20); ctx.lineTo(-5,35); ctx.lineTo(-5,25); ctx.fill();
      ctx.restore();
      
      // Draw grabbed item
      if(claw.itemHit) {
        let it = claw.itemHit;
        ctx.rotate(-(claw.angle - Math.PI/2)); // unrotate
        
        ctx.save();
        ctx.translate(0, 20 + it.radius/2);
        drawItem(it, ctx);
        ctx.restore();
      }
      ctx.restore();
      
      // Draw floating texts
      floatingTexts.forEach(ft => {
        ctx.globalAlpha = ft.life / 60;
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 24px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
      });
      ctx.globalAlpha = 1;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
